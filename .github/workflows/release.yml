name: release

# Publica um Release com instaladores ao criar uma tag v*, ex.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build .app + .dmg (universal)
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan-dev libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist/sandra-mine
          cp target/release/sandra-mine README.md LICENSE dist/sandra-mine/
          cp packaging/linux/install.sh packaging/linux/sandra-mine.desktop dist/sandra-mine/
          cp -r assets/icon/linux dist/sandra-mine/icons
          tar -C dist -czf "dist/SandraMine-$V-linux-x86_64.tar.gz" sandra-mine
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist/sandra-mine | Out-Null
          Copy-Item target/release/sandra-mine.exe, README.md, LICENSE dist/sandra-mine/
          Compress-Archive -Path dist/sandra-mine/* -DestinationPath "dist/SandraMine-$v-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  headless:
    # Sem interface: estático (musl, só CPU) para x86_64, aarch64 e armv7, e glibc com GPU
    # (Vulkan carregado em tempo de execução) para x86_64 e aarch64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64-musl, features: "" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, name: linux-aarch64-musl, features: "" }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, name: linux-armv7-musl, features: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64-gpu, features: "--features gpu" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64-gpu, features: "--features gpu" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          T=${{ matrix.target }}
          if [[ $T == *musl* ]]; then
            # Estático com o clang (C do ring) e o rust-lld, sem toolchain cruzada.
            U=$(echo "$T" | tr '[:lower:]-' '[:upper:]_'); L=$(echo "$T" | tr '-' '_')
            C=${T/unknown-/}
            export "CARGO_TARGET_${U}_LINKER=rust-lld" "CC_${L}=clang" "CFLAGS_${L}=--target=${C}"
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release -p sandra-mine-headless --target "$T" ${{ matrix.features }}
      - name: Package
        shell: bash
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' headless/Cargo.toml | head -1)
          D=dist/sandra-mine-headless
          mkdir -p $D
          cp target/${{ matrix.target }}/release/sandra-mine-headless README.md LICENSE \
             headless/sandra-mine-headless.service headless/Dockerfile $D/
          tar -C dist -czf "dist/SandraMine-headless-$V-${{ matrix.name }}.tar.gz" sandra-mine-headless
      - uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.name }}
          path: dist/*.tar.gz

  publish:
    needs: [macos, linux, windows, headless]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
