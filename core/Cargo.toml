[package]
name = "sandra-core"
version = "0.4.0"
edition = "2024"
description = "Motor do SandraMine: stratum, mineração na CPU, frota e dados da rede, sem interface"
license = "MIT"
repository = "https://github.com/tnarnold/sandra-mine"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
gethostname = "1.1.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
ureq = "3.5.1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
