[package]
name = "sandra-mine"
version = "0.5.0"
edition = "2024"
description = "Emulador desktop do NerdMiner (minerador solo de Bitcoin) com bandeja e controle de CPU/GPU"
license = "MIT"
repository = "https://github.com/tnarnold/sandra-mine"

[workspace]
members = ["core", "headless"]

[dependencies]
sandra-core = { path = "core", features = ["gpu"] }
bytemuck = "1.25.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
eframe = "0.37.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sha2 = "0.11.1"
tray-icon = { version = "0.26.1", default-features = false }

# Linux: tray via StatusNotifierItem (D-Bus), no GTK main loop needed alongside winit.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
